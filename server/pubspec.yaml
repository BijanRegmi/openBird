name: openbird_server
description: Self-hosted server implementing the Shorebird code push protocol.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  args: ^2.6.0
  path: ^1.9.0
  crypto: ^3.0.6
  http_parser: ^4.1.2
  logging: ^1.3.0
  meta: ^1.16.0
  mime: ^2.0.0
  minio: ^3.5.0
  pointycastle: ^3.9.1
  postgres: ^3.5.0
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_static: ^1.1.3
  # The exact models the Shorebird CLI uses, generated from Shorebird's
  # openapi.yaml. Pinned to protocol/shorebird.lock's SHOREBIRD_CLI_SHA;
  # tool/sync_protocol.sh keeps the two in step.
  shorebird_code_push_protocol:
    git:
      url: https://github.com/shorebirdtech/shorebird.git
      path: packages/shorebird_code_push_protocol
      ref: a7d42977f3620014c683ccde51604492a50aefc4
  yaml: ^3.1.3

dev_dependencies:
  # Shorebird's own API client at the pinned SHA: the contract test drives
  # the server exactly as the CLI does.
  shorebird_code_push_client:
    git:
      url: https://github.com/shorebirdtech/shorebird.git
      path: packages/shorebird_code_push_client
      ref: a7d42977f3620014c683ccde51604492a50aefc4
  http: ^1.2.2
  lints: ^5.0.0
  test: ^1.25.0
